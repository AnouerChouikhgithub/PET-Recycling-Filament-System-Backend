# 3awedlou — Mosquitto 2 configuration for LOCAL DEVELOPMENT.
#
# Dev only: plaintext MQTT, no TLS. The compose file binds the listener to
# 127.0.0.1, so this broker must never be reachable from the internet.
# Production must use TLS on 8883 with per-device credentials.

# Plain TCP listener. Bound to 0.0.0.0 INSIDE the container only; compose
# maps it to 127.0.0.1:1883 so nothing outside this machine can reach it.
listener 1883 0.0.0.0

# No anonymous clients: every connection needs a user from password_file.
allow_anonymous false

# Secrets. The password file is git-ignored; create users with
# bin/mqtt-user.ps1 / bin/mqtt-user.sh (never edit it by hand).
password_file /mosquitto/config/passwd

# Authorisation: backend may read/write the whole tree, machines only their
# own topic branch (see acl for the {prefix} value).
acl_file /mosquitto/config/acl

# Keep subscriptions/messages across restarts (stored in the named data
# volume). Required so retained Last Will messages survive a broker restart.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose -f compose.mqtt.yaml logs -f` works.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
