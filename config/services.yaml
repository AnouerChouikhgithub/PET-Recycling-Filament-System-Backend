# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Domain exception → stable API error code + HTTP status.
    # Consumed by App\Api\EventSubscriber\ApiExceptionSubscriber; add new
    # mappings here instead of editing subscriber code.
    # (Symfony HttpExceptions and security exceptions are handled generically.)
    app.api_exception_map:
        # Broker unreachable / publish not acknowledged → the command API must
        # answer honestly instead of reporting success it cannot guarantee.
        'App\Api\Exception\MqttUnavailableException':
            status: 503
            code: MQTT_UNAVAILABLE

    # Machine command safety limits (validated against the firmware's real
    # PID target: 245 °C for PET). The heater cap stays above the target so
    # the PID can reach it, but far below what would damage the machine.
    app.command.heater_max_c: '%env(float:COMMAND_HEATER_MAX_C)%'
    app.command.motor_max: '%env(float:COMMAND_MOTOR_MAX)%'
    app.command.fan_max: '%env(float:COMMAND_FAN_MAX)%'

    # MQTT non-secret defaults. .env.example documents every MQTT_* variable;
    # these parameters are the fallback used by %env(default:<param>:…)% so the
    # container still boots when .env/.env.local omits one, and so the "off"
    # default (MQTT_ENABLED=false) cannot be forgotten. Never put a secret here.
    app.mqtt.enabled_default: false
    app.mqtt.qos_default: 1
    app.mqtt.command_ttl_seconds_default: 30
    app.mqtt.max_payload_bytes_default: 4096
    app.mqtt.telemetry_max_per_second_default: 2

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Security/DeviceUser.php'

    App\Api\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $tokenStorage: '@security.token_storage'
            $exceptionMap: '%app.api_exception_map%'
            $debug: '%kernel.debug%'

    App\Api\EventSubscriber\AuthRateLimitSubscriber:
        arguments:
            $loginLimiter: '@limiter.auth_login'
            $registerLimiter: '@limiter.auth_register'

    App\Controller\Api\AuthController:
        arguments:
            $registrationEnabled: '%env(bool:AUTH_REGISTER_ENABLED)%'

    App\Service\Machine\MachineConnectivityService:
        arguments:
            $offlineAfterMinutes: '%env(int:MACHINE_OFFLINE_AFTER_MINUTES)%'

    App\Security\MachineAccess:
        # The list/ownership enforcement point — injected into the query service.
        # (autowired; TokenStorage + MachineRepository resolve automatically.)

    App\Service\IoT\MachineCommandGuard:
        # Safety ranges come from env (deployment config, not magic numbers).
        # Defaults live in .env: heater 260 °C (firmware PET PID target is
        # 245 °C), motor/fan 0–100 %.
        arguments:
            $heaterMaxC: '%app.command.heater_max_c%'
            $motorMax: '%app.command.motor_max%'
            $fanMax: '%app.command.fan_max%'

    App\Security\DeviceTokenAuthenticator: ~

    App\Service\IoT\MqttConfig:
        # Typed MQTT_* parameters (App\Service\IoT\MqttConfig). The five
        # `default:` fallbacks keep the container bootable when .env does not
        # define the variable; MQTT_ENABLED defaults to false, i.e. no socket.
        arguments:
            $enabled: '%env(default:app.mqtt.enabled_default:bool:MQTT_ENABLED)%'
            $host: '%env(string:MQTT_HOST)%'
            $port: '%env(int:MQTT_PORT)%'
            $username: '%env(string:MQTT_USERNAME)%'
            $password: '%env(string:MQTT_PASSWORD)%'
            $clientId: '%env(string:MQTT_CLIENT_ID)%'
            $tls: '%env(bool:MQTT_TLS)%'
            $prefix: '%env(string:MQTT_PREFIX)%'
            $qos: '%env(default:app.mqtt.qos_default:int:MQTT_QOS)%'
            $commandTtlSeconds: '%env(default:app.mqtt.command_ttl_seconds_default:int:MQTT_COMMAND_TTL_SECONDS)%'
            $maxPayloadBytes: '%env(default:app.mqtt.max_payload_bytes_default:int:MQTT_MAX_PAYLOAD_BYTES)%'
            $telemetryMaxPerSecond: '%env(default:app.mqtt.telemetry_max_per_second_default:int:MQTT_TELEMETRY_MAX_PER_SECOND)%'

    App\Service\IoT\MqttTopicBuilder:
        arguments:
            $prefix: '%env(string:MQTT_PREFIX)%'

    # Inbound seam used by `app:mqtt:consume` — a real socket when a broker is
    # configured, a test double in the suite. Business logic never sees it.
    App\Service\IoT\MqttSubscriberInterface: '@App\Service\IoT\PhpMqttSubscriber'

    # Outbound connection seam (only PhpMqttConnection may use the library).
    App\Service\IoT\MqttConnectionInterface: '@App\Service\IoT\PhpMqttConnection'

    # Outbound seam. MQTT_ENABLED=false (default) keeps the historical
    # buffering publisher — no socket, dev/tests unchanged; MQTT_ENABLED=true
    # routes to the real broker and raises MqttUnavailableException on failure.
    App\Service\IoT\MqttPublisherInterface: '@App\Service\IoT\SelectedMqttPublisher'

    App\Service\IoT\SelectedMqttPublisher:
        # public on purpose: it is the single place the transport is chosen,
        # so tests (and debug tooling) can swap or inspect it without touching
        # the controller, the guard or the audit trail. Keeping it public also
        # stops the container from inlining it into MachineCommandService.
        public: true
        arguments:
            $config: '@App\Service\IoT\MqttConfig'
            $buffered: '@App\Service\IoT\BufferingMqttPublisher'
            $broker: '@App\Service\IoT\BrokerMqttPublisher'

    # Realtime fan-out: 'logging' today, WebSocket/SSE/Mercure hub later —
    # rebind this alias only.
    App\Service\Realtime\RealtimeBroadcaster: '@App\Service\Realtime\LoggingRealtimeBroadcaster'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
