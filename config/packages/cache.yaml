framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Shared store for the AI agent's per-user MESSAGE rate limit.
            # It MUST be a real (out-of-process) pool: the limiter window has
            # to survive between requests, otherwise AGENT_RATE_LIMIT_MESSAGES
            # can never produce a 429 in a per-request SAPI (BUGS-TO-FIX F3).
            # default_lifetime: 0 = items keep their own expiry (the sliding
            # window sets it), so the pool never silently expires a window.
            agent_rate_limiter:
                adapter: cache.app
                default_lifetime: 0

when@test:
    framework:
        cache:
            pools:
                # NOT the array adapter: TestContainer resets every pool
                # between requests, and ArrayAdapter::reset() clears its data,
                # which would make the cross-request window untestable (and
                # silently re-hide F3). The filesystem pool keeps the window
                # across requests exactly like dev/prod; keys are per-user
                # UUIDs, so entries cannot leak between test methods.
                agent_rate_limiter:
                    adapter: cache.adapter.filesystem
