# PREPARED, NEVER RUN. Production Mosquitto (mqtts on 8883).
#
# This is NOT the development broker configuration in docker/mosquitto/:
#   * no plaintext listener exists at all (there is no `listener 1883`);
#   * anonymous access is off and every client needs a password;
#   * the ACL file limits each device to its own machine topics;
#   * TLS certificates are mounted read-only from deploy/certs (never committed).
#
# Host-provided files this config expects (see compose.prod.yaml):
#   /mosquitto/config/passwd   — created with `mosquitto_passwd` on the host
#   /mosquitto/config/acl      — deploy/mosquitto/acl in this repo
#   /mosquitto/certs/ca.crt    — CA that signed the server certificate
#   /mosquitto/certs/server.crt, /mosquitto/certs/server.key

per_listener_settings true

listener 8883

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS: broker-to-device traffic is encrypted; clients verify the CA on connect.
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

# Persist retained messages and queued QoS 1/2 deliveries across restarts.
persistence true
persistence_location /mosquitto/data/

# Logs go to the container log driver; never log payloads.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# A hostile or broken client must not be able to push the broker over.
max_packet_size 65536
message_size_limit 65536
max_connections 500
max_queued_messages 1000
